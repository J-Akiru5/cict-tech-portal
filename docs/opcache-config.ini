; ============================================
; OPcache & JIT Configuration for PHP 8.x
; ============================================
; Copy these settings to your php.ini or create a separate opcache.ini
; Location: /etc/php/8.x/fpm/conf.d/opcache.ini (Linux)
;           C:\php\php.ini (Windows)
;
; After adding, restart PHP:
;   - Linux: sudo systemctl restart php8.x-fpm
;   - Windows: Restart Apache/PHP service
;   - Laravel Sail: sail down && sail up -d

[opcache]
; Enable OPcache
opcache.enable=1
opcache.enable_cli=1

; Memory settings (increase for larger apps)
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; Performance settings
opcache.validate_timestamps=0      ; Set to 1 in DEVELOPMENT only
opcache.revalidate_freq=0
opcache.fast_shutdown=1
opcache.save_comments=1            ; Required for Laravel annotations

; ============================================
; JIT Compilation (PHP 8.0+ ONLY)
; ============================================
; JIT can provide 10-50% performance boost for CPU-intensive tasks
opcache.jit_buffer_size=100M
opcache.jit=1255

; JIT mode explanation:
; 1255 = tracing JIT (recommended for web apps)
; 1235 = function JIT (good for CLI scripts)
; 0    = disable JIT

; ============================================
; Production Checklist
; ============================================
; Run these commands before deploying:
;
; php artisan config:cache
; php artisan route:cache
; php artisan view:cache
; php artisan event:cache
; php artisan icons:cache        (if using Blade Icons)
; composer install --optimize-autoloader --no-dev
;
; Clear caches when deploying new code:
; php artisan optimize:clear

; ============================================
; Verify OPcache is enabled
; ============================================

; Run: php -i | grep opcache
; Or visit: /phpinfo.php (then remove it!)
